# Font
font_family      JetBrainsMono Nerd Font
font_size        14.0

# Remote control (used by Claude Code to focus the right tab on notification click)
allow_remote_control yes
listen_on unix:/tmp/kitty-{kitty_pid}

# macOS specific
macos_option_as_alt yes
# Disable shell integration's prompt detection so confirm always triggers
shell_integration no-prompt-mark

# Clear all default shortcuts so Cmd keys don't conflict with Neovim
clear_all_shortcuts yes

# ── Essential Kitty shortcuts (keep these) ──────────────────────
map cmd+c         copy_to_clipboard
map cmd+v         paste_from_clipboard
map cmd+n         new_os_window
map cmd+t         new_tab
map cmd+shift+t   new_tab_with_cwd
map cmd+q         close_window_with_confirmation
map cmd+shift+equal change_font_size all +1.0
map cmd+minus     change_font_size all -1.0
map cmd+shift+0   change_font_size all 0
# Cmd+0 (git status) — 0=48
map cmd+0         send_text all \x1b[48;9u
map cmd+shift+]   next_tab
map cmd+shift+[   previous_tab
map cmd+k         clear_terminal scrollback active

# ── Forward Cmd keys to Neovim via CSI u sequences ─────────────
# Format: \x1b[<unicode_codepoint>;<modifier>u
# Super(Cmd) modifier = 9, Super+Shift = 10

# Cmd+S (save) — s=115
map cmd+s         send_text all \x1b[115;9u
# Cmd+O (find file) — o=111
map cmd+o         send_text all \x1b[111;9u
# Cmd+P (hover/type info) — p=112
map cmd+p         send_text all \x1b[112;9u
# Cmd+E (recent files) — e=101
map cmd+e         send_text all \x1b[101;9u
# Cmd+1 (toggle file tree) — 1=49
map cmd+1         send_text all \x1b[49;9u
# Cmd+B (go to definition) — b=98
map cmd+b         send_text all \x1b[98;9u
# Cmd+D (duplicate line) — d=100
map cmd+d         send_text all \x1b[100;9u
# Cmd+Z (undo) — z=122
map cmd+z         send_text all \x1b[122;9u
# Cmd+W (close buffer/pane in Neovim) — w=119
map cmd+w         send_text all \x1b[119;9u
# Cmd+Shift+W (close Kitty tab)
map cmd+shift+w   close_tab
# Cmd+A (select all) — a=97
map cmd+a         send_text all \x1b[97;9u
# Cmd+/ (toggle comment) — /=47
map cmd+/         send_text all \x1b[47;9u

# Cmd+F (search current buffer) — f=102
map cmd+f         send_text all \x1b[102;9u
# Cmd+I (inline hunk preview) — i=105
map cmd+i         send_text all \x1b[105;9u
# Cmd+Shift+P (toggle terminal) — p=112
map cmd+shift+p   send_text all \x1b[112;10u
# Cmd+[ (jump back) — [=91
map cmd+[         send_text all \x1b[91;9u
# Cmd+] (jump forward) — ]=93
map cmd+]         send_text all \x1b[93;9u
# Cmd+Shift+F (find in files) — f=102
map cmd+shift+f   send_text all \x1b[102;10u
# Cmd+Shift+B (type definition) — b=98
map cmd+shift+b   send_text all \x1b[98;10u
# Cmd+Shift+R (rename) — r=114
map cmd+shift+r   send_text all \x1b[114;10u
# Cmd+Shift+K (delete line) — k=107
map cmd+shift+k   send_text all \x1b[107;10u
# Cmd+Shift+Z (redo) — z=122
map cmd+shift+z   send_text all \x1b[122;10u
# Cmd+Shift+A (command palette) — a=97
map cmd+shift+a   send_text all \x1b[97;10u

# ── Theme ───────────────────────────────────────────────────────
include themes/night_owl.conf

# ── Appearance ──────────────────────────────────────────────────
window_padding_width 4
hide_window_decorations titlebar-only
confirm_os_window_close 1
cursor_blink_interval 0
enable_audio_bell yes

# ── Notifications ───────────────────────────────────────────────
# Notify when a command running for 5+ seconds finishes
notify_on_cmd_finish always 5.0 notify
